<!doctype html>
<html lang="ko">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="theme-color" content="#eff4ff" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />

		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="icon" href="/icons/favicon.ico" sizes="48x48" />
		<link rel="apple-touch-icon" href="/icons/apple-touch-icon-180x180.png" />

		<script>
			window.addEventListener('beforeinstallprompt', (event) => {
				event.preventDefault();
				window.__deferredInstallPrompt = event;
				window.dispatchEvent(new Event('installpromptavailable'));
			});

			window.addEventListener('appinstalled', () => {
				window.__deferredInstallPrompt = null;
			});
		</script>

		<title>켄텍 총학생회</title>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-code="hover">
		<div style="display: contents">%sveltekit.body%</div>
		<script>
			(() => {
				const iosStandalone = window.navigator.standalone === true;
				const isPwa =
					window.matchMedia('(display-mode: standalone)').matches ||
					iosStandalone ||
					document.referrer.startsWith('android-app://');

				const root = document.documentElement;
				root.classList.add(isPwa ? 'mode-pwa' : 'mode-web');
			})();
		</script>
	</body>
</html>
