name: SvelteKit CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

jobs:
  continuous-integration:
    runs-on: ubuntu-latest
    env:
      MONGO_URI: 'mongodb://localhost:27017/dummy'
      AUTH_SECRET: 'dummy_secret_key_for_testing_purposes_only'
      GOOGLE_ID: 'dummy_google_id'
      GOOGLE_SECRET: 'dummy_google_secret'
      AWS_BUCKET_NAME: 'dummy-bucket'
      AWS_ID: 'dummy_aws_id'
      AWS_SECRET: 'dummy_aws_secret'
      AWS_BUCKET_REGION: 'ap-northeast-2'
      MAX_FILE_SIZE: '10485760'

    steps:
      # 1. 깃허브 소스코드 가져오기
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 2. Node.js 환경 세팅 (최신 LTS인 20버전 권장)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: 'npm'

      # 3. 의존성 패키지 깔끔하게 설치 (npm install 대신 npm ci 사용)
      - name: Install Dependencies
        run: npm ci

      # 4. 코드 스타일 및 린트 전체 전수 검사
      # (만약 Prettier/ESLint 경고를 무시하고 강제 푸시했다면 여기서 걸러집니다)
      - name: Check Lint & Formatting
        run: |
          npx prettier --check .
          npx eslint src vite.config.ts eslint.config.js

      # 5. SvelteKit 타입스크립트 및 문법 전수 검사
      - name: Run Svelte Check
        run: npm run check

      # 7. SvelteKit 실제 빌드 검사 (가장 중요)
      # ( 환경 변수가 누락되었거나 배포 시 터질 코드라면 여기서 실패 처리됩니다 )
      - name: Build Project
        run: npm run build
